<style>
/* The board is the one page a customer sees, so it is laid out like the
   printed card rather than like the terminal: two columns of ruled
   sections on cream, prices hanging on the right in mono. */
body{background:var(--cream)}
.board{max-width:900px;margin:0 auto;padding:0 18px 70px}

.board-head{
  background:linear-gradient(160deg,var(--rose) 0%,var(--rose-pale) 100%);
  margin:0 -18px 0;padding:34px 24px 30px;text-align:center;position:relative;
}
.board-head::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:26px;background:var(--cream);
  border-radius:100% 100% 0 0 / 100% 100% 0 0;
}
.board-head .brand{font-size:clamp(2.2rem,9vw,3.4rem);margin:6px 0 6px}
.board-head .brand-sub{font-size:.66rem;letter-spacing:.24em}
.board-meta{
  text-align:center;padding:26px 0 8px;font-size:.86rem;color:var(--muted);line-height:1.8;
}
.board-meta strong{color:var(--plum);font-weight:600}

.board-cols{columns:2;column-gap:38px;margin-top:18px}
.board-sect{break-inside:avoid;margin-bottom:26px}
.board-row{
  display:flex;align-items:baseline;gap:8px;padding:5px 0;
}
.board-row .nm{font-family:'Zilla Slab',serif;font-size:.98rem;color:var(--ink)}
.board-row .sz{font-size:.74rem;color:var(--muted);white-space:nowrap}
.board-row .dots{
  flex:1;border-bottom:1px dotted var(--line-strong);transform:translateY(-3px);min-width:14px;
}
.board-row .pr{
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.92rem;color:var(--plum-deep);white-space:nowrap;
}
.board-foot{
  margin:34px -18px 0;padding:26px 24px;background:var(--kawali);color:#E8DDD6;
  text-align:center;font-size:.84rem;line-height:1.9;
}
.board-foot a{color:var(--rose-pale)}
.board-note{
  text-align:center;font-size:.74rem;color:var(--muted);margin-top:22px;line-height:1.7;
}
.board-loading{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:680px){
  .board-cols{columns:1}
  .board-head{padding:26px 18px 24px}
}
/* Only ever drawn for a browser that is already signed in — see the script
   at the foot of this file. A diner holding the QR code must not be handed
   a route into the till. */
.board-back{
  position:fixed;top:14px;left:14px;z-index:20;
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:22px;text-decoration:none;
  background:var(--plum-deep);color:#F3E3E6;
  font-family:'Karla',sans-serif;font-size:.82rem;font-weight:700;
  box-shadow:0 2px 10px rgba(64,35,44,.28);
  transition:background .15s,transform .15s;
}
.board-back:hover,.board-back:focus-visible{background:var(--plum);transform:translateY(-1px)}
@media(max-width:600px){.board-back{top:9px;left:9px;padding:7px 12px;font-size:.76rem}}

@media print{
  .board-foot{background:none;color:#000;border-top:1px solid #000}
  .board-head{background:none}
  .board-back{display:none}
}
</style>
</head>
<body data-page="board">

<div class="board">
  <header class="board-head">
    <div class="est">EST &middot; 2024</div>
    <div class="brand">FREDDY'S</div>
    <div class="brand-sub">Seafood Grill &amp; Restaurant</div>
  </header>

  <div class="board-meta" id="boardMeta"></div>

  <main id="boardBody">
    <div class="board-loading">Loading the menu&hellip;</div>
  </main>

  <p class="board-note" id="boardNote"></p>

  <footer class="board-foot" id="boardFoot"></footer>
</div>
